<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
</head>

<body>
    <!--Dark top sector-->
    <div class="header-wrapper">
        <div class="container">
            <!--Header Area-->
            <header>
                <div class="logo">Header Logo</div>
                <nav>
                    <ul>
                        <li><a href="#">header link one</a></li>
                        <li><a href="#">header link two</a></li>
                        <li><a href="#">header link three</a></li>
                    </ul>
                </nav>
            </header>
            <section class="hero">
                <div class="hero-content">
                    <h1 class="hero-title">This website is awesome</h1>
                    <p class="hero-subtext">This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast</p>
                    <button class="btn">Sign up</button>
                </div>
                <div class="hero-img">this is a placeholder for an image</div>
            </section>
        </div>
    </div>

    <!--Information Section-->
    <section class="info-section">
        <div class="container">
            <h2 class="info-heading">Some random information.</h2>
        </div>
    </section>

</body>

</html>
